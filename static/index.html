<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TTS Test Client</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    input, button { margin: 0.5rem 0; }
    #status { margin-top: 1rem; font-weight: bold; }
    video { margin-top: 1rem; width: 100%; max-width: 600px; }
  </style>
</head>
<body>

<h1>TTS Test Client</h1>

<label for="file">Select a file:</label>
<input type="file" id="file" accept=".txt,.pdf" />
<br/>
<label for="user_id">User ID:</label>
<input type="text" id="user_id" placeholder="Enter X-User-ID" />
<br/>
<button id="uploadBtn">Upload & Generate Speech</button>

<div id="status"></div>

<video id="player" controls></video>

<script>
const uploadBtn = document.getElementById("uploadBtn");
const statusDiv = document.getElementById("status");
const player = document.getElementById("player");

uploadBtn.addEventListener("click", async () => {
  const fileInput = document.getElementById("file");
  const userId = document.getElementById("user_id").value.trim();

  if (!fileInput.files.length || !userId) {
    alert("Please select a file and enter a User ID.");
    return;
  }

  const file = fileInput.files[0];
  const formData = new FormData();
  formData.append("file", file);

  statusDiv.innerText = "Uploading file...";

  // Upload file to FastAPI
  const uploadResp = await fetch("/upload_file", {
    method: "POST",
    headers: { "X-User-ID": userId },
    body: formData
  });

  const uploadData = await uploadResp.json();
  console.log("Upload response data:", uploadData); // 🟡 Debug line

  const jobId = uploadData.job_id;
  const voice = uploadData.voice;
  console.log("Extracted jobId:", jobId);

  statusDiv.innerText = `File uploaded. Job ID: ${jobId}\nWaiting for processing...`;

  // Poll job status every 2 seconds
  const interval = setInterval(async () => {
    const resp = await fetch(`/job_status/${jobId}`);
    const data = await resp.json();
    statusDiv.innerText = `Job Status: ${data.status || "unknown"}\nChunks done: ${data.chunks_done || 0}`;

    if (data.status === "completed") {
      clearInterval(interval);
      statusDiv.innerText += "\nJob completed! Loading audio...";

      const manifestUrl = `/stream/${userId}/${jobId}/${voice}/manifest.m3u8`;

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(manifestUrl);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          player.play();
        });
      } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
        player.src = manifestUrl;
        player.addEventListener('loadedmetadata', function() {
          player.play();
        });
      } else {
        statusDiv.innerText += "\nYour browser does not support HLS playback.";
      }
    }
  }, 2000);
});
</script>

</body>
</html>
