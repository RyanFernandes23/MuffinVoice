version: '3.8'

services:
  db:
    # Uses Postgres 16 with pre-installed pgvector extension (useful for your AI/Embeddings)
    image: pgvector/pgvector:pg16
    container_name: wikivoice_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: wikivoice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d wikivoice"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # Persist data even if container is removed
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wikivoice_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
