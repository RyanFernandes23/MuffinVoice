version: '3.8'

services:
  db:
    # Uses Postgres 16 with pre-installed pgvector extension (useful for your AI/Embeddings)
    image: pgvector/pgvector:pg16
    container_name: wikivoice_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: wikivoice
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d wikivoice" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # Persist data even if container is removed
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wikivoice_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wikivoice_api
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  worker_chunker:
    build:
      context: .
      dockerfile: Dockerfile.worker-chunker
    container_name: wikivoice_chunker
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  worker_tts:
    build:
      context: .
      dockerfile: Dockerfile.worker-tts
    container_name: wikivoice_tts
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

volumes:
  postgres_data:
  redis_data:
